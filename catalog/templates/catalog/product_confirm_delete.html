{% extends 'catalog/base.html' %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 50px auto; padding: 30px; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background-color: #fff;">
    <h2 style="color: #dc3545; margin-bottom: 20px;">Удаление товара</h2>

    <p style="font-size: 1.1rem; margin-bottom: 30px; color: #212529;">
        Вы уверены, что хотите безвозвратно удалить товар <strong>«{{ object.name }}»</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <!-- Кнопка подтверждения удаления -->
        <button type="submit" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-right: 10px;">
            Да, удалить
        </button>

        <!-- Кнопка отмены возвращает в панель управления -->
        <a href="{% url 'catalog:manage_products' %}" style="padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 6px; font-size: 1rem; display: inline-block;">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
